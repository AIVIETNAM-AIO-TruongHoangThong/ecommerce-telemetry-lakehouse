snowflake:
  # Override these via environment variables in production
  account: "${SNOWFLAKE_ACCOUNT}"
  user: "${SNOWFLAKE_USER}"
  password: "${SNOWFLAKE_PASSWORD}"
  warehouse: "${SNOWFLAKE_WAREHOUSE}"
  database: "${SNOWFLAKE_DATABASE}"
  role: "${SNOWFLAKE_ROLE}"

  schemas:
    bronze: "BRONZE"
    silver: "SILVER"
    gold: "GOLD"

  tables:
    bronze_events: "BRONZE.RAW_EVENTS"
    fact_events: "SILVER.FACT_EVENTS"
    fact_sessions: "SILVER.FACT_SESSIONS"
    dim_products: "SILVER.DIM_PRODUCTS"
    dim_users: "SILVER.DIM_USERS"
    gold_features: "GOLD.SESSION_FEATURES"

  # Enable Spark query pushdown to Snowflake
  pushdown_enabled: true
