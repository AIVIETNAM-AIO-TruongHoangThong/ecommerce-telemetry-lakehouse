spark:
  master: "spark://spark-master:7077"
  app_name: "ecommerce-telemetry-pipeline"
  driver_memory: "2g"
  executor_memory: "4g"
  executor_cores: 4
  packages:
    - "org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.11.0"
    - "org.apache.hadoop:hadoop-aws:3.3.4"
    - "com.amazonaws:aws-java-sdk-bundle:1.12.262"
  log_level: "WARN"
