[project]
name = "ecommerce-telemetry-lakehouse"
version = "0.1.0"
description = "Production E-Commerce Telemetry Ingestion Engine -> Apache Iceberg Lakehouse"
readme = "README.md"
authors = [
    { name = "Thong Truong", email = "thongtr.dev@gmail.com" }
]
requires-python = ">=3.11, <3.13"
dependencies = [
    "pyspark==3.5.1",
    "pyarrow>=15.0.0",
    "click>=8.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"