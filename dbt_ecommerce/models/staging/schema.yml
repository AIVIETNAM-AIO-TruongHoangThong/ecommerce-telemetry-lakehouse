version: 2

# -- Sources -------------------------------------------------------------------
sources:
  - name: bronze
    database: iceberg
    schema: lakehouse
    tables:
      - name: bronze_events
        description: "Raw e-commerce event records loaded by PySpark ingestion into Apache Iceberg."
        columns:
          - name: event_time
            description: "UTC timestamp string of the event."
          - name: event_type
            description: "Event type: view, cart, remove_from_cart, purchase."
          - name: user_id
            description: "Unique user identifier."
          - name: user_session
            description: "Source-provided session UUID."

# -- Staging models -------------------------------------------------------------
models:
  - name: stg_raw_events
    description: "Cleaned and type-cast view of Bronze raw events."
    columns:
      - name: event_id
        description: "Surrogate key generated from user_id + event_time + event_type."
        tests:
          - unique
          - not_null

      - name: event_timestamp
        tests:
          - not_null

      - name: event_type
        tests:
          - not_null
          - accepted_values:
              values: ["view", "cart", "remove_from_cart", "purchase"]

      - name: user_id
        tests:
          - not_null

      - name: price
        description: "Product price - must be non-negative."
